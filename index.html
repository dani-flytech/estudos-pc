<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef2f7;--card:#fff;--tx:#122033;--mu:#5d6d80;--bd:#d8dfe8;--ac:#1d5fd1;--ac2:#e7effd;--ok:#17803d;--okb:#e1f5e8;--er:#b42318;--erb:#fde6e3;--gd:#c27c0e;--gdb:#fdf3e0;--sh:0 1px 2px rgba(16,32,51,.06),0 4px 14px rgba(16,32,51,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0d141d;--card:#161f2b;--tx:#e8eef5;--mu:#93a3b6;--bd:#283547;--ac:#6ea3ff;--ac2:#1a2a44;--ok:#5fd68a;--okb:#13331d;--er:#ff8b7f;--erb:#3b1a17;--gd:#f2b84b;--gdb:#3a2c12;--sh:none}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0d141d;--card:#161f2b;--tx:#e8eef5;--mu:#93a3b6;--bd:#283547;--ac:#6ea3ff;--ac2:#1a2a44;--ok:#5fd68a;--okb:#13331d;--er:#ff8b7f;--erb:#3b1a17;--gd:#f2b84b;--gdb:#3a2c12;--sh:none}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:680px;padding:14px 16px 32px;box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 12px}
.brand{font-size:1.15rem;font-weight:700;letter-spacing:-.01em}
.brand small{display:block;font-size:.78rem;font-weight:500;color:var(--mu)}
.chip{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:5px 12px 5px 6px;box-shadow:var(--sh);font-variant-numeric:tabular-nums;font-weight:600;font-size:.88rem;white-space:nowrap;flex:none}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--mu)}
.chip.run .dot{background:var(--ok);box-shadow:0 0 0 3px var(--okb)}
.ring{transform:rotate(-90deg)}.ring .rb{fill:none;stroke:var(--bd)}.ring .rf{fill:none;stroke:var(--ac);stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring.done .rf{stroke:var(--ok)}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;background:transparent;border:0;border-radius:9px;padding:9px;font-weight:600;color:var(--mu)}
.tabs button.on{background:var(--ac2);color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;box-shadow:var(--sh);margin-bottom:14px}
.goal{display:flex;gap:18px;align-items:center}
.goal .big{position:relative;width:112px;height:112px;flex:none}
.goal .big .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.goal .big .c b{font-size:1.35rem}.goal .big .c span{font-size:.75rem;color:var(--mu)}
.goal h2{margin:0 0 4px;font-size:1.05rem}
.goal p{margin:2px 0;color:var(--mu);font-size:.88rem;line-height:1.4}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:.82rem;font-weight:600;background:var(--gdb);color:var(--gd);margin-top:6px}
.lnk{background:none;border:0;color:var(--ac);font-weight:600;padding:0;font-size:.85rem}
.sect{display:flex;align-items:baseline;justify-content:space-between;margin:20px 2px 8px}
.sect h3{margin:0;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mu)}
.sect span{font-size:.8rem;color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.tc{text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:6px;min-height:104px}
.tc:hover{border-color:var(--ac)}
.tc .ic{font-size:1.4rem}.tc b{font-size:.98rem;line-height:1.25}.tc .s{font-size:.8rem;color:var(--mu)}
.tc .mb{height:5px;border-radius:3px;background:var(--bd);overflow:hidden;margin-top:auto}.tc .mb i{display:block;height:100%;background:var(--ac)}
.tc.add{border-style:dashed;box-shadow:none;background:transparent;align-items:center;justify-content:center;text-align:center;color:var(--mu)}
.tc.add .ic{font-size:1.6rem;color:var(--ac)}
.help{font-size:.9rem;line-height:1.5;color:var(--mu)}.help code{display:block;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;color:var(--tx);margin:8px 0;font-family:inherit;white-space:pre-wrap}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mu);font-size:.85rem;margin-bottom:12px;gap:8px}
.back{background:none;border:0;color:var(--ac);font-weight:600;padding:0 0 10px;font-size:.92rem}
.q{font-size:1.18rem;font-weight:600;line-height:1.38;margin:0 0 16px}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:2px solid var(--bd);border-radius:12px;padding:13px 14px;margin-bottom:10px;line-height:1.35}
.opt:hover:not(:disabled){border-color:var(--ac)}
.opt.no{background:var(--erb);border-color:var(--er);color:var(--er);text-decoration:line-through}
.opt.yes{background:var(--okb);border-color:var(--ok);color:var(--ok);font-weight:600}
.opt:disabled{cursor:default}
.opt small{display:block;font-size:.82rem;color:var(--mu);margin-top:3px;font-weight:400}
.msg{min-height:1.4em;margin:4px 0 10px;font-weight:600;white-space:pre-line}
.msg.ok{color:var(--ok)}.msg.er{color:var(--er)}
.exp{background:var(--ac2);border-left:4px solid var(--ac);border-radius:10px;padding:11px 13px;margin:0 0 12px;line-height:1.45;font-size:.95rem}
.exp b{color:var(--ac)}
.go{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:13px 20px;font-weight:600;width:100%}
.sec{background:transparent;border:2px solid var(--ac);color:var(--ac);margin-top:10px}
.seg{display:flex;gap:6px;margin-bottom:12px}.seg button{flex:1;background:var(--bg);border:2px solid var(--bd);border-radius:10px;padding:9px;font-weight:600;font-size:.9rem}.seg button.on{border-color:var(--ac);color:var(--ac);background:var(--ac2)}
.in{width:100%;box-sizing:border-box;font:inherit;padding:13px 14px;border:2px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);margin-bottom:10px}.in:focus{outline:none;border-color:var(--ac)}
.sc{overflow-x:auto}.sc svg{width:100%;min-width:420px;height:auto}.gl{stroke:var(--bd);stroke-width:1}.gt{fill:var(--mu);font-size:11px}.ln{fill:none;stroke:var(--ac);stroke-width:2.5}.dt{fill:var(--ac)}
.bx{fill:var(--ac);opacity:.85}.bx.ok{fill:var(--ok)}.gx{stroke:var(--gd);stroke-width:1.5;stroke-dasharray:5 4}
ol{padding-left:20px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:9;max-width:90vw;text-align:center}
.note{color:var(--mu);font-size:.85rem;margin:8px 0 0}
.row{display:flex;gap:8px;flex-wrap:wrap}.row .go{flex:1 1 140px;margin-top:8px;width:auto}
textarea.in{min-height:90px;font-size:.85rem}
.inst{display:flex;gap:12px;align-items:center;background:var(--ac2);border-color:var(--ac)}
.inst .ic{font-size:1.6rem}.inst p{margin:0;font-size:.9rem;line-height:1.45}
</style>
</head>

function build(e){
  const f=e.f;const[g,t,a,ex]=f;let q=t,ans,ds;
  if(g==="x"){ans=a;ds=ex}
  else{
    const u=U[g];ans=a+u;
    if(["kg","lb","L","gal"].includes(g))q+=" (em "+u.trim()+")";
    let p=P[g].filter(x=>x!==a);
    if(u!==""&&p.every(x=>isFinite(num(x))))p=p.sort((x,y)=>Math.abs(num(x)-num(a))-Math.abs(num(y)-num(a))).slice(0,6);
    ds=sh(p).slice(0,3).map(x=>x+u);
  }
  return{q,ans,g,idx:e.k,ex:f[4]||"",opts:sh([ans,...ds])};
}

const IDLE=180000; // 3 min sem tocar na tela = pausa
const dk=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
let lastAct=Date.now(),blurred=false,running=false,unsaved=0,goalMsg=false;
["pointerdown","keydown","touchstart","wheel","scroll"].forEach(ev=>addEventListener(ev,()=>{lastAct=Date.now();blurred=false},{passive:true,capture:true}));
addEventListener("blur",()=>{blurred=true;tick(true);saveTime()});
addEventListener("focus",()=>{blurred=false;lastAct=Date.now();tick(true)});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState!=="visible"){tick(true);saveTime()}else{lastAct=Date.now();blurred=false;tick(true)}});
addEventListener("pagehide",()=>saveTime());
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?h+":"+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0"):m+":"+String(x).padStart(2,"0")};
const todayS=()=>TM.d[dk()]||0;
function streak(){
  let n=0;const d=new Date();
  if(todayS()>=TM.g)n=1;
  d.setDate(d.getDate()-1);
  while((TM.d[dk(d)]||0)>=TM.g){n++;d.setDate(d.getDate()-1)}
  return n;
}
function tick(uiOnly){
  const on=document.visibilityState==="visible"&&!blurred&&Date.now()-lastAct<IDLE;
  if(!uiOnly&&on){
    const k=dk(),before=TM.d[k]||0;TM.d[k]=before+1;unsaved++;
    if(before<TM.g&&TM.d[k]>=TM.g&&!goalMsg){goalMsg=true;toast("🎉 Meta de hoje batida! "+Math.round(TM.g/60)+" min de estudo.");saveTime();if(view==="home")drawHome()}
    if(unsaved>=20){unsaved=0;saveTime()}
  }
  running=on;
  const s=todayS(),p=Math.min(s/TM.g,1),done=s>=TM.g;
  $("tchip").className="chip"+(on?" run":"");
  $("ctxt").textContent=fmt(s)+" / "+Math.round(TM.g/60)+" min";
  const cr=$("cring");cr.querySelector(".rf").style.strokeDashoffset=94.25*(1-p);cr.classList.toggle("done",done);
  const gr=$("gring");if(gr){gr.querySelector(".rf").style.strokeDashoffset=301.6*(1-p);gr.classList.toggle("done",done);$("gtime").textContent=fmt(s);$("gstat").textContent=on?"▶ Contando":"⏸ Pausado"}
}

const T=s=>(s.replace(/(\d)\s*[-–—]\s*(\d)/g,"$1 a $2").replace(/−/g,"-").match(/[+-]?\d+(?:[.,]\d+)*/g)||[]).map(t=>{t=t.replace("+","");return /^-?\d{1,3}(\.\d{3})+$/.test(t)?+t.replace(/\./g,""):parseFloat(t.replace(",","."))});
function match(c,v){
  if(c.g==="v"){const n=s=>s.toLowerCase().replace(/[^a-z0-9]/g,"").replace(/o/g,"0");return n(v)===n(c.ans)}
  const a=T(c.ans),b=T(v);return a.length>0&&a.length===b.length&&a.every((x,k)=>x===b[k]);
}
const hintFor=c=>c.g==="v"?"Digite a sigla (ex.: VA).":T(c.ans).length>1?"Digite os dois valores, na ordem (ex.: 60 a 90).":(U[c.g]?"Responda só com o número ("+U[c.g].trim()+").":"Responda só com o número.");
function submit(){
  if(done)return;
  const inp=$("inp"),v=inp.value.trim();if(!v)return;
  const m=$("msg");
  if(match(cur,v)){
    done=true;if(tries===0)first++;else missed.push(cur);
    m.className="msg ok";m.textContent="✓ Correto! Resposta: "+cur.ans;showExp();
    inp.disabled=true;$("sb").hidden=true;$("gb").hidden=true;
    $("sc").textContent="✓ de primeira: "+first;$("next").hidden=false;$("next").focus();
  }else{tries++;m.className="msg er";m.textContent="✗ Errado. Tente de novo.";inp.select()}
}
function giveUp(){
  if(done)return;done=true;missed.push(cur);
  const m=$("msg");m.className="msg er";m.textContent="Resposta: "+cur.ans;showExp();
  $("inp").disabled=true;$("sb").hidden=true;$("gb").hidden=true;$("next").hidden=false;$("next").focus();
}
function end(){
  done=true;saveRun();
  $("pb").style.width="100%";$("pos").textContent=tName(TPc);
  const b=$("box");b.innerHTML="";
  const pc=Math.round(first/deck.length*100);
  b.appendChild(el("p","q",(pc>=90?"🏆 ":pc>=70?"👏 ":"💪 ")+"Fim! "+first+" de "+deck.length+" de primeira ("+pc+"%)."));
  b.appendChild(el("p","note","Tempo de estudo hoje: "+fmt(todayS())+" de "+Math.round(TM.g/60)+" min."));
  b.appendChild(el("div",null," "));
  const r=el("button","go","Refazer (embaralhado)");r.onclick=()=>start(lst,lab);b.appendChild(r);
  if(missed.length){const s=el("button","go sec","Refazer só as que errei ("+missed.length+")");const mi=missed.map(x=>x.idx);s.onclick=()=>start(mi.map(k=>KM[k]).filter(Boolean),"Só as erradas");b.appendChild(s)}
  const mb=el("button","go sec","Escolher outro modo");mb.onclick=menu;b.appendChild(mb);
}
document.addEventListener("keydown",ev=>{if(view!=="quiz")return;
  if(ev.target&&ev.target.tagName==="SELECT")return;
  if(ev.key==="Enter"&&done&&$("next")&&!$("next").hidden){ev.preventDefault();i++;show();return}
  const k=parseInt(ev.key);
  if(k>=1&&k<=4&&!done){const bs=document.querySelectorAll(".opt");if(bs[k-1])bs[k-1].click()}
});

/* ---------- histórico ---------- */
let HT="all";
function drawHist(){
  const h=$("hs");h.innerHTML="";
  // tempo de estudo
  const c0=el("div","card");h.appendChild(c0);
  c0.appendChild(el("p","q","⏱️ Tempo de estudo por dia"));
  const days=[];for(let k=13;k>=0;k--){const d=new Date();d.setDate(d.getDate()-k);days.push(d)}
  const vals=days.map(d=>(TM.d[dk(d)]||0)/60),gm=TM.g/60;
  const wk=vals.slice(-7),avg=Math.round(wk.reduce((a,b)=>a+b,0)/7),met=Object.values(TM.d).filter(v=>v>=TM.g).length;
  c0.appendChild(el("p","msg","Hoje "+Math.floor(todayS()/60)+" min · média 7 dias "+avg+" min · 🔥 "+streak()+" seguidos · meta batida em "+met+(met===1?" dia":" dias")));
  {const W=600,Hh=200,x0=36,y0=14,w=W-x0-10,hh=Hh-y0-28,mx=Math.max(gm*1.25,...vals,1),bw=w/14*0.62;
   const Y=v=>y0+hh-v/mx*hh,X=k=>x0+w/14*(k+.5);let g="";
   [0,.5,1].map(f=>Math.round(mx*f)).forEach(v=>{g+=`<line x1="${x0}" x2="${W-10}" y1="${Y(v)}" y2="${Y(v)}" class="gl"/><text x="${x0-6}" y="${Y(v)+4}" text-anchor="end" class="gt">${v}</text>`});
   vals.forEach((v,k)=>{const d=days[k];g+=`<rect x="${X(k)-bw/2}" y="${Y(v)}" width="${bw}" height="${Math.max(0,y0+hh-Y(v))}" rx="3" class="bx${v>=gm?" ok":""}"><title>${d.toLocaleDateString("pt-BR")}: ${Math.round(v)} min</title></rect><text x="${X(k)}" y="${Hh-8}" text-anchor="middle" class="gt">${d.getDate()}</text>`});
   g+=`<line x1="${x0}" x2="${W-10}" y1="${Y(gm)}" y2="${Y(gm)}" class="gx"/><text x="${W-12}" y="${Y(gm)-5}" text-anchor="end" class="gt">meta ${gm} min</text>`;
   const wr=el("div","sc");wr.innerHTML=`<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Minutos de estudo nos últimos 14 dias">${g}</svg>`;c0.appendChild(wr)}
  // acertos
  const c=el("div","card");h.appendChild(c);
  c.appendChild(el("p","q","🎯 Acertos de primeira por rodada"));
  const sel=el("select","in");[["all","Todos os temas"],...TEMAS.map(t=>[t.id,t.n])].forEach(([v,n])=>{const o=el("option",null,n);o.value=v;sel.appendChild(o)});sel.value=HT;sel.onchange=()=>{HT=sel.value;drawHist()};c.appendChild(sel);
  const R=H.runs.filter(r=>HT==="all"||(r.tp||"c152")===HT).sort((a,b)=>a.t-b.t);
  if(!R.length){c.appendChild(el("p","note","Ainda não há rodadas concluídas aqui. Termine um quiz para ver o gráfico."));}
  else{
  const pc=R.map(r=>Math.round(r.f/r.n*100));
  const av=Math.round(pc.reduce((a,b)=>a+b,0)/pc.length),best=Math.max(...pc);
  c.appendChild(el("p","msg",R.length+(R.length===1?" rodada":" rodadas")+" · média "+av+"% · melhor "+best+"% · última "+pc[pc.length-1]+"%"));
  const L=R.slice(-30),p=pc.slice(-30),W=600,Hh=220,x0=36,y0=16,w=W-x0-12,hh=Hh-y0-28;
  const X=k=>x0+(L.length>1?k/(L.length-1)*w:w/2),Y=v=>y0+hh-v/100*hh;
  let g="";
  [0,25,50,75,100].forEach(v=>{g+=`<line x1="${x0}" x2="${W-12}" y1="${Y(v)}" y2="${Y(v)}" class="gl"/><text x="${x0-6}" y="${Y(v)+4}" text-anchor="end" class="gt">${v}%</text>`});
  g+=`<polyline points="${p.map((v,k)=>X(k)+","+Y(v)).join(" ")}" class="ln"/>`;
  p.forEach((v,k)=>{const n=R.length-L.length+k+1,d=new Date(L[k].t).toLocaleDateString("pt-BR"),tn=tName(L[k].tp||"c152");g+=`<circle cx="${X(k)}" cy="${Y(v)}" r="4" class="dt"><title>Rodada ${n} · ${tn} (${L[k].b||"Todas"}): ${v}% (${L[k].f}/${L[k].n}) em ${d}</title></circle>`;if(L.length<=15||k%5===0)g+=`<text x="${X(k)}" y="${Hh-8}" text-anchor="middle" class="gt">${n}</text>`});
  const wrap=el("div","sc");wrap.innerHTML=`<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Gráfico de acertos de primeira por rodada">${g}</svg>`;c.appendChild(wrap);
  }
  const wk2=Object.entries(H.weak).filter(([k])=>KM[k]&&(HT==="all"||KM[k].tp===HT)).sort((a,b)=>b[1]-a[1]).slice(0,10);
  if(wk2.length){
    const t2=el("p","q","Questões que mais erro");t2.style.marginTop="20px";c.appendChild(t2);
    const ol=el("ol");
    wk2.forEach(([k,v])=>{const f=KM[k].f;ol.appendChild(el("li",null,f[1]+" — "+(f[0]==="x"?f[2]:f[2]+U[f[0]])+" ("+v+"×)"))});
    c.appendChild(ol);
  }
  c.appendChild(el("p","note",db?"Histórico e tempo salvos na sua conta do Claude.":"Histórico e tempo salvos neste aparelho. Faça um backup de vez em quando."));
  drawBackup(h);
}
/* ---------- backup ---------- */
const backupData=()=>JSON.stringify({app:"estudos-pc",v:1,at:Date.now(),H,TM});
async function importData(txt){
  const o=JSON.parse(txt);if(!o||o.app!=="estudos-pc"||!o.H)throw new Error("arquivo inválido");
  const have=new Set(H.runs.map(r=>r.t)),nw=(o.H.runs||[]).filter(r=>r&&r.t&&!have.has(r.t));
  H.runs.push(...nw);
  Object.entries(o.H.weak||{}).forEach(([k,v])=>H.weak[k]=Math.max(H.weak[k]||0,v));
  Object.entries(o.H.seen||{}).forEach(([k,v])=>H.seen[k]=Math.max(H.seen[k]||0,v));
  Object.entries((o.TM||{}).d||{}).forEach(([k,v])=>TM.d[k]=Math.max(TM.d[k]||0,v));
  if(db){try{const c=db.collection("data/users/"+uid);for(const r of nw)await c.doc("r"+r.t).set(r);await c.doc("weak").set({c:H.weak,s:H.seen})}catch(e){}}
  lsSave();await saveTime();
  return nw.length;
}
function drawBackup(h){
  const c=el("div","card");h.appendChild(c);
  c.appendChild(el("p","q","💾 Backup"));
  c.appendChild(el("p","help","Guarde uma cópia do histórico e do tempo de estudo, ou passe os dados de um aparelho para outro. Importar junta os dados, não apaga nada."));
  const m=el("div","msg");
  const r1=el("div","row");c.appendChild(r1);
  const ex=el("button","go","Exportar arquivo");ex.onclick=()=>{try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([backupData()],{type:"application/json"}));a.download="estudos-pc-backup-"+dk()+".json";document.body.appendChild(a);a.click();a.remove();m.className="msg ok";m.textContent="Arquivo gerado. Se nada aparecer, use Copiar backup."}catch(e){m.className="msg er";m.textContent="Não deu para baixar aqui. Use Copiar backup."}};r1.appendChild(ex);
  const cp=el("button","go sec","Copiar backup");cp.onclick=async()=>{try{await navigator.clipboard.writeText(backupData());m.className="msg ok";m.textContent="Backup copiado. Cole em Notas ou no outro aparelho."}catch(e){m.className="msg er";m.textContent="Não deu para copiar neste aparelho."}};r1.appendChild(cp);
  const r2=el("div","row");c.appendChild(r2);
  const fi=el("input");fi.type="file";fi.accept=".json,application/json,text/plain";fi.hidden=true;c.appendChild(fi);
  const im=el("button","go sec","Importar arquivo");im.onclick=()=>fi.click();r2.appendChild(im);
  const pa=el("button","go sec","Colar backup");r2.appendChild(pa);
  const ta=el("textarea","in");ta.placeholder="Cole aqui o texto do backup";ta.hidden=true;ta.style.marginTop="10px";c.appendChild(ta);
  const ok=el("button","go","Importar o texto colado");ok.hidden=true;c.appendChild(ok);
  c.appendChild(m);
  const run=async txt=>{try{const n=await importData(txt);m.className="msg ok";m.textContent="✓ Backup importado: "+n+(n===1?" rodada nova.":" rodadas novas.");setTimeout(()=>{drawHist()},1200)}catch(e){m.className="msg er";m.textContent="✗ Esse backup não é válido."}};
  fi.onchange=async()=>{const f=fi.files[0];if(f)run(await f.text())};
  pa.onclick=()=>{ta.hidden=!ta.hidden;ok.hidden=ta.hidden;if(!ta.hidden)ta.focus()};
  ok.onclick=()=>{if(ta.value.trim())run(ta.value.trim())};
}

go("home");
init();

  navigator.serviceWorker.register("sw.js").catch(()=>{});
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
}
