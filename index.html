<!DOCTYPE html>
<html lang="pt-BR">

<title>Estudos PC — App de treino</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">

<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef2f7;--card:#fff;--tx:#122033;--mu:#5d6d80;--bd:#d8dfe8;--ac:#1d5fd1;--ac2:#e7effd;--ok:#17803d;--okb:#e1f5e8;--er:#b42318;--erb:#fde6e3;--gd:#c27c0e;--gdb:#fdf3e0;--sh:0 1px 2px rgba(16,32,51,.06),0 4px 14px rgba(16,32,51,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0d141d;--card:#161f2b;--tx:#e8eef5;--mu:#93a3b6;--bd:#283547;--ac:#6ea3ff;--ac2:#1a2a44;--ok:#5fd68a;--okb:#13331d;--er:#ff8b7f;--erb:#3b1a17;--gd:#f2b84b;--gdb:#3a2c12;--sh:none}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0d141d;--card:#161f2b;--tx:#e8eef5;--mu:#93a3b6;--bd:#283547;--ac:#6ea3ff;--ac2:#1a2a44;--ok:#5fd68a;--okb:#13331d;--er:#ff8b7f;--erb:#3b1a17;--gd:#f2b84b;--gdb:#3a2c12;--sh:none}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:680px;padding:14px 16px 32px;box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 12px}
.brand{font-size:1.15rem;font-weight:700;letter-spacing:-.01em}
.brand small{display:block;font-size:.78rem;font-weight:500;color:var(--mu)}
.chip{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:5px 12px 5px 6px;box-shadow:var(--sh);font-variant-numeric:tabular-nums;font-weight:600;font-size:.88rem;white-space:nowrap;flex:none}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--mu)}
.chip.run .dot{background:var(--ok);box-shadow:0 0 0 3px var(--okb)}
.hr{display:flex;gap:8px;align-items:center;flex:none}
.gear{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--bd);box-shadow:var(--sh);font-size:1.05rem;display:flex;align-items:center;justify-content:center;padding:0}
.lbl{font-weight:600;margin:16px 0 8px}
.pbtn{display:block;background:none;border:0;padding:3px 0 0;color:var(--ac);font-size:.85rem;font-weight:600;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--bd)}
.pnm{display:flex;align-items:center;gap:10px;min-width:0}.pnm b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pem{font-size:1.5rem}
.pact{display:flex;gap:6px;align-items:center;flex:none}
.sbtn{background:var(--bg);border:1.5px solid var(--bd);border-radius:9px;padding:7px 11px;font-weight:600;font-size:.85rem}.sbtn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.emo{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.emo button{width:46px;height:46px;border-radius:10px;border:2px solid var(--bd);background:var(--bg);font-size:1.35rem;padding:0}.emo button.on{border-color:var(--ac);background:var(--ac2)}
.dang{border-color:var(--er)!important;color:var(--er)!important}
.area{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px 16px;box-shadow:var(--sh);margin-bottom:12px}
.area:hover{border-color:var(--ac)}
.aic{flex:none;width:58px;height:58px;border-radius:16px;background:var(--ac2);display:flex;align-items:center;justify-content:center;font-size:1.9rem}
.atx{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}.atx b{font-size:1.15rem}.atx .s,.chd .s{font-size:.82rem;color:var(--mu)}
.aar{flex:none;font-size:1.8rem;color:var(--mu);line-height:1}
.chd{display:flex;align-items:center;gap:14px;margin:0 2px 4px}.chd h2{margin:0 0 2px;font-size:1.3rem}
.kp{display:flex;gap:10px;margin:4px 0 12px}.kpi{flex:1;background:var(--bg);border-radius:12px;padding:12px 8px;text-align:center}
.kpi b{display:block;font-size:1.55rem;font-variant-numeric:tabular-nums}.kpi span{font-size:.76rem;color:var(--mu)}
.ins{font-size:.95rem;line-height:1.5;margin:0 0 6px}
.trow{padding:13px 0;border-top:1px solid var(--bd)}.trow:first-of-type{border-top:0}
.th{display:flex;justify-content:space-between;align-items:center;gap:8px}.th b{font-size:.95rem}
.lv{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;border:1.5px solid currentColor;white-space:nowrap}
.ts{font-size:.82rem;color:var(--mu);margin-top:4px}
.dbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--bd);margin-top:8px}.dbar i{display:block;height:100%}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--mu);margin-top:12px}.lg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
.ma{fill:none;stroke:var(--gd);stroke-width:2.5;stroke-dasharray:6 4}
.stp{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:10px}
.stp button{width:48px;height:48px;border-radius:12px;border:2px solid var(--bd);background:var(--bg);font-size:1.4rem;font-weight:700}
.stp span{font-size:1.7rem;font-weight:700;min-width:120px;text-align:center;font-variant-numeric:tabular-nums}
.ring{transform:rotate(-90deg)}.ring .rb{fill:none;stroke:var(--bd)}.ring .rf{fill:none;stroke:var(--ac);stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring.done .rf{stroke:var(--ok)}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;background:transparent;border:0;border-radius:9px;padding:9px;font-weight:600;color:var(--mu)}
.tabs button.on{background:var(--ac2);color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;box-shadow:var(--sh);margin-bottom:14px}
.goal{display:flex;gap:18px;align-items:center}
.goal .big{position:relative;width:112px;height:112px;flex:none}
.goal .big .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.goal .big .c b{font-size:1.35rem}.goal .big .c span{font-size:.75rem;color:var(--mu)}
.goal h2{margin:0 0 4px;font-size:1.05rem}
.goal p{margin:2px 0;color:var(--mu);font-size:.88rem;line-height:1.4}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:.82rem;font-weight:600;background:var(--gdb);color:var(--gd);margin-top:6px}
.lnk{background:none;border:0;color:var(--ac);font-weight:600;padding:0;font-size:.85rem}
.sect{display:flex;align-items:baseline;justify-content:space-between;margin:20px 2px 8px}
.sect h3{margin:0;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mu)}
.sect span{font-size:.8rem;color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.tc{text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:6px;min-height:104px}
.tc:hover{border-color:var(--ac)}
.tc .ic{font-size:1.4rem}.tc b{font-size:.98rem;line-height:1.25}.tc .s{font-size:.8rem;color:var(--mu)}
.tc .mb{height:5px;border-radius:3px;background:var(--bd);overflow:hidden;margin-top:auto}.tc .mb i{display:block;height:100%;background:var(--ac)}
.tc.add{border-style:dashed;box-shadow:none;background:transparent;align-items:center;justify-content:center;text-align:center;color:var(--mu)}
.tc.add .ic{font-size:1.6rem;color:var(--ac)}
.help{font-size:.9rem;line-height:1.5;color:var(--mu)}.help code{display:block;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;color:var(--tx);margin:8px 0;font-family:inherit;white-space:pre-wrap}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mu);font-size:.85rem;margin-bottom:12px;gap:8px}
.back{background:none;border:0;color:var(--ac);font-weight:600;padding:0 0 10px;font-size:.92rem}
.q{font-size:1.18rem;font-weight:600;line-height:1.38;margin:0 0 16px}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:2px solid var(--bd);border-radius:12px;padding:13px 14px;margin-bottom:10px;line-height:1.35}
.opt:hover:not(:disabled){border-color:var(--ac)}
.opt.no{background:var(--erb);border-color:var(--er);color:var(--er);text-decoration:line-through}
.opt.yes{background:var(--okb);border-color:var(--ok);color:var(--ok);font-weight:600}
.opt:disabled{cursor:default}
.opt small{display:block;font-size:.82rem;color:var(--mu);margin-top:3px;font-weight:400}
.msg{min-height:1.4em;margin:4px 0 10px;font-weight:600;white-space:pre-line}
.msg.ok{color:var(--ok)}.msg.er{color:var(--er)}
.exp{background:var(--ac2);border-left:4px solid var(--ac);border-radius:10px;padding:11px 13px;margin:0 0 12px;line-height:1.45;font-size:.95rem}
.exp b{color:var(--ac)}
.go{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:13px 20px;font-weight:600;width:100%}
.sec{background:transparent;border:2px solid var(--ac);color:var(--ac);margin-top:10px}
.seg{display:flex;gap:6px;margin-bottom:12px}.seg button{flex:1;background:var(--bg);border:2px solid var(--bd);border-radius:10px;padding:9px;font-weight:600;font-size:.9rem}.seg button.on{border-color:var(--ac);color:var(--ac);background:var(--ac2)}
.in{width:100%;box-sizing:border-box;font:inherit;padding:13px 14px;border:2px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);margin-bottom:10px}.in:focus{outline:none;border-color:var(--ac)}
.sc{overflow-x:auto}.sc svg{width:100%;min-width:420px;height:auto}.gl{stroke:var(--bd);stroke-width:1}.gt{fill:var(--mu);font-size:11px}.ln{fill:none;stroke:var(--ac);stroke-width:2.5}.dt{fill:var(--ac)}
.bx{fill:var(--ac);opacity:.85}.bx.ok{fill:var(--ok)}.gx{stroke:var(--gd);stroke-width:1.5;stroke-dasharray:5 4}
ol{padding-left:20px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:9;max-width:90vw;text-align:center}
.note{color:var(--mu);font-size:.85rem;margin:8px 0 0}
.row{display:flex;gap:8px;flex-wrap:wrap}.row .go{flex:1 1 140px;margin-top:8px;width:auto}
textarea.in{min-height:90px;font-size:.85rem}
.inst{display:flex;gap:12px;align-items:center;background:var(--ac2);border-color:var(--ac)}
.inst .ic{font-size:1.6rem}.inst p{margin:0;font-size:.9rem;line-height:1.45}
</style>
</head>

{id:"pitot",n:"Sistema pitot-estático",ic:"🧭",cat:"pc",q:[
["x","Qual instrumento usa a pressão de impacto (pitot)?","Somente o velocímetro",["Velocímetro e altímetro","Velocímetro, altímetro e variômetro","Altímetro e variômetro"],"O pitot leva a pressão total só ao velocímetro; a estática alimenta os três instrumentos."],
["x","Quais instrumentos recebem a pressão estática?","Velocímetro, altímetro e variômetro",["Somente o altímetro","Altímetro e variômetro","Velocímetro e altímetro"],"Os três usam a estática; só o velocímetro usa também o pitot."],
["x","O velocímetro mede a diferença entre:","Pressão total (pitot) e pressão estática",["Pressão estática e pressão da cabine","Pressão total e pressão padrão (1013 hPa)","Pressão dinâmica e pressão de impacto"],"Total − estática = pressão dinâmica, que é convertida em velocidade."],
["x","Onde fica o tubo de pitot no C152?","Sob a asa esquerda",["Sob a asa direita","No nariz, acima da hélice","No estabilizador vertical"],"Ele fica fora da influência da hélice e da fuselagem, apontado para o vento relativo, para medir a pressão de impacto sem perturbação."],
["x","Onde fica a tomada estática no C152?","Na lateral esquerda da fuselagem dianteira",["Na ponta da asa direita","Dentro do tubo de pitot","No cone de cauda, lado direito"],"É um orifício paralelo ao fluxo de ar, num ponto onde a pressão do ar em volta da fuselagem é a mais próxima da pressão estática real."],
["x","Pitot obstruído, dreno livre e estática livre. O velocímetro:","Cai para zero",["Funciona como altímetro","Congela no último valor","Indica normalmente"],"A pressão do pitot escapa pelo dreno e se iguala à estática: a diferença vai a zero."],
["x","Pitot e dreno obstruídos, estática livre, em subida. O velocímetro:","Aumenta, como se fosse um altímetro",["Diminui até zero","Fica parado no valor do bloqueio","Oscila sem padrão"],"A pressão presa no pitot fica constante enquanto a estática cai: a diferença cresce com a altitude."],
["x","Com a tomada estática obstruída, o altímetro:","Congela na altitude do bloqueio",["Indica zero","Indica a mais na subida","Passa a indicar a altitude-densidade"],"O altímetro só lê a pressão estática. Se ela fica presa, as cápsulas aneroides não mudam e o ponteiro para."],
["x","Com a tomada estática obstruída, o variômetro:","Indica zero",["Indica subida constante","Indica descida constante","Funciona normalmente"],"Sem variação de pressão estática, as pressões no diafragma e na caixa se igualam e a indicação fica em zero."],
["x","Estática obstruída, em descida. O velocímetro indica:","Mais que a velocidade real",["Menos que a velocidade real","A velocidade correta","Zero"],"A pressão presa é a de uma altitude maior (pressão menor); ao descer, a pressão total cresce e a diferença fica exagerada."],
["x","Estática obstruída, em subida. O velocímetro indica:","Menos que a velocidade real",["Mais que a velocidade real","A velocidade correta","Zero"],"Na subida a pressão total cai, mas a estática presa continua alta: a diferença fica menor que a real."],
["x","Usando a fonte estática alternativa (dentro da cabine), altímetro e velocímetro geralmente:","Indicam um pouco acima do real",["Indicam um pouco abaixo do real","Não mudam","Vão a zero"],"A pressão na cabine costuma ser menor que a externa. No C152 a fonte alternativa é equipamento opcional."],
["x","Para que serve o aquecimento do pitot?","Evitar gelo no tubo de pitot",["Aquecer a cabine","Corrigir o erro de temperatura do velocímetro","Desembaçar o para-brisa"],"Gelo pode fechar a entrada do pitot e o dreno, causando leituras falsas no velocímetro. O aquecimento é ligado antes de entrar em condição de gelo."],
["x","Voando de alta para baixa pressão sem reajustar o altímetro, ele indica:","Mais alto que a altitude real",["Mais baixo que a altitude real","A altitude real","Zero"],"'De alta para baixa, cuidado embaixo': você está mais baixo do que o altímetro mostra."],
["x","O que é a velocidade calibrada (CAS)?","IAS corrigida dos erros de instrumento e de instalação",["IAS corrigida de temperatura e altitude","TAS corrigida do vento","A velocidade em relação ao solo"],"A posição do pitot e da estática causa pequenos erros, maiores em ângulos de ataque altos. A tabela de calibração do POH converte IAS em CAS."],
["x","Com o aumento da altitude, para a mesma IAS, a TAS:","Aumenta, cerca de 2% a cada 1000 ft",["Diminui, cerca de 2% a cada 1000 ft","Fica igual à IAS","Aumenta cerca de 10% a cada 1000 ft"],"O ar fica menos denso: para gerar a mesma pressão dinâmica (mesma IAS), o avião precisa se mover mais rápido pelo ar."],
["x","Com 1013 hPa (QNE) ajustado, o altímetro indica:","Altitude-pressão (nível de voo)",["Altura sobre o aeródromo","Altitude-densidade","Altitude verdadeira acima do nível do mar"],"Com a pressão padrão, todos os aviões usam a mesma referência. É a base dos níveis de voo acima da altitude de transição."],
["x","Como funciona o variômetro?","Compara a estática atual com uma pressão retida por um orifício calibrado",["Compara a pressão de pitot com a estática","Mede a variação da pressão de pitot","Usa um giroscópio para medir a razão vertical"],"Por isso ele tem um pequeno atraso (6 a 9 s) até mostrar a razão estabilizada."]
]},
/* ===== SAFE TALK (Out) — perguntas e respostas do documento ===== */
{id:"stb777",n:"B777",ic:"🛫",cat:"st",q:[
["x","Who is responsible for the pre-flight check of the additional jump seats?","The station owner.",["The Purser.","The Cabin Supervisor (CSV).","The Flight Deck crew."]],
["x","State R1 responsibility during a Planned Emergency on board the B777-300.","Conduct an individual Manual and Emergency Demonstration to passengers seated in F/Class.",["Brief the Able-Bodied Passengers (ABPs) at the R1 door.","Secure the galleys and report cabin ready to the Purser.","Conduct the demonstration for J/Class passengers."]],
["x","State the pre-flight check of the L3 cabin door on the B777-300.","Door disarmed, EPAS gauge in the green zone, red arrow aligned, safety strap fully retracted.",["Door armed, EPAS gauge in the red zone, red arrow aligned, safety strap across the door frame.","Door disarmed, EPAS gauge in the yellow zone, girt bar indicator yellow, safety strap extended.","Door armed, girt bar engaged, red arrow not aligned, safety strap fully retracted."],"The door owner shall ensure: the door is disarmed; the EPAS pressure gauge needle is in the green zone; the RED arrow is aligned when the door is closed and locked; the safety strap is fully retracted and not visible in the door frame."],
["x","What does it mean if the red arrow on the door is not aligned when the door is closed?","The EPAS has been manually deactivated and the door is not ready for flight.",["The slide is armed and ready for flight.","The girt bar is engaged into the floor brackets.","The door is closed and locked correctly."]],
["x","State the procedure for re-opening a cabin door after completing the door pre-flight check.","Apply the door operating SOP using a Door Checker before re-opening any cabin door.",["Open the door and inform the Purser afterwards.","Arm the door, then open it with the Purser's permission.","Re-open the door only with the Captain's permission."]],
["x","Who is responsible for the pre-flight check of the CRC on the B777-200?","R3",["L3","R1","The Purser"]],
["x","True or False? L5 and R5 are not required to take part in the safety manual demonstration.","True",["False"]],
["x","What features are armed when the doors are armed?","The girt bar and the Emergency Power Assist System (EPAS).",["The slide raft and the door assist handle lights.","The emergency lights and the escape path lighting.","Only the girt bar; the EPAS stays deactivated."],"Girt bar is engaged into floor brackets (except at LR3 doors on the B777-300) and the Emergency Power Assist System (EPAS) is armed."],
["x","What colour are the girt bar indicators when the door is armed?","Yellow",["Green","Red","White"]],
["x","State the primary exits for a land evacuation on the B777-300.","All cabin doors.",["Doors L1/R1 and L5/R5 only.","Doors 2 and 4 only.","The Flight Deck windows and doors 1."]],
["x","State the Cabin Crew actions if the escape slide (B777-300 LR3) fails to inflate automatically.","Pull down the cover and pull the red manual inflation handle in the upper aft section of the door frame.",["Pull the yellow handle on the girt bar.","Close the door and redirect passengers to another exit.","Pull the white release handle on the slide pack."],"Use the red manual inflation handle located in the upper aft section of the door frame: pull down the cover to access the red manual inflation handle, then pull down the handle."],
["x","State the steps to disconnect the B777 slide raft.","Lift the flap, pull the white release handle, cut the mooring line.",["Lift the flap, pull the red inflation handle, cut the mooring line.","Cut the mooring line, then pull the girt bar out of the floor brackets.","Pull the white release handle, then deflate the slide raft."]],
["x","What is the purpose of the re-entry strap?","Help re-entry into the aircraft and avoid the free fall of the slide raft when disconnected.",["Secure the slide raft to the aircraft during ditching.","Hold passengers inside the slide raft in rough water.","Inflate the slide raft manually."],"Help re-entry into the aircraft after evacuation, and avoid the free fall of the slide raft when disconnected from the aircraft (for survival purposes)."],
["x","What should Cabin Crew do if the slide raft / escape slide has not inflated automatically on the B777?","Use the red manual inflation handle.",["Use the white release handle.","Pull the girt bar out of the floor brackets.","Disarm and re-arm the door."]],
["x","Where is the red manual inflation handle located on the B777-200 doors?","On the RHS of the girt bar.",["On the LHS of the girt bar.","In the upper aft section of the door frame.","Under the door assist handle."]],
["x","What is the purpose of the slide raft canopy?","Protection against poor weather conditions such as wind and rain.",["Keep the slide raft afloat if it is damaged.","Make the slide raft visible to rescuers at night.","Store the survival kit during the evacuation."]],
["x","State the duration of the emergency lights once activated (B777).","Approximately 15 minutes.",["Approximately 10 minutes.","Approximately 30 minutes.","Approximately 60 minutes."]],
["x","When does the cabin automatic drop-down oxygen system activate (B777)?","Automatically at ~14,000 ft cabin altitude, electrically from the Flight Deck, or manually at each PSU, LSU and/or SU.",["Automatically at ~10,000 ft cabin altitude only.","Only when the Captain announces a decompression.","Automatically at ~25,000 ft, or by the Purser from the cabin panel."],"Automatically at approximately 14,000 ft cabin altitude (all service units open releasing oxygen masks); electrically from the Flight Deck overhead panel by pressing the 'PASS OXYGEN' guarded switch; manually from each PSU, LSU and/or SU using any sharp object."],
["x","What is the state of the cabin drop-down oxygen system (B777)?","Solid state.",["Gaseous, from portable bottles.","Liquid oxygen.","Compressed air from the engines."]],
["x","State the Cabin Crew actions when a Decompression Alert occurs.","Be seated on the jump seat with seat belt and shoulder harness fastened, prepared to put on a drop-down oxygen mask.",["Go to the nearest door and check it is armed.","Walk the cabin to help passengers with their masks.","Take a portable oxygen bottle and report to the Purser."]],
["x","What is the function of the yellow lanyard attached to the oxygen mask in the SU and the LSU?","Pulling it lets the masks drop further and starts the oxygen flow to both masks.",["Pulling it stops the oxygen flow after use.","It resets the oxygen system after a decompression.","It is used to hang the mask back on the PSU."]],
["x","State the pre-flight check of the smoke detectors (B777).","Green steady power indicator light ON; detector not tampered with or obstructed.",["Red steady light ON; detector covered.","Green flashing light; detector tested with the test button.","Amber light ON; detector not obstructed."]],
["x","What does a green flashing light on the photoelectric smoke detector indicate?","Maintenance is required.",["The detector is working normally.","Smoke has been detected.","The detector has failed."]],
["x","What does a red flashing light on the photoelectric smoke detector indicate?","The smoke detector has failed.",["Maintenance is required.","The detector is working normally.","The detector has been reset."]],
["x","How can the lavatory smoke detection system be reset (B777)?","Press the flashing amber lavatory call light above the affected lavatory door.",["Press the reset button on the smoke detector.","Press the smoke reset key on the Purser's panel only.","Switch the lavatory power off and on."]],
["x","How can Cabin Crew make a Priority PA on the B777?","Press 4* and press and hold the PTT button.",["Press 46 and press and hold the PTT button.","Press 5* and release the PTT button.","Press the EMER key for 2 seconds."]],
["x","How is a PA ALL initiated on the B777 aircraft?","Press 46 and then press and hold the PTT button.",["Press 4* and then press and hold the PTT button.","Press 55 and then release the PTT button.","Press and hold the PTT button only."]],
["x","What are the audio and visual indications in the cabin when a conference call is initiated from any station?","Hi-Lo chime and flashing red light on all MCLs.",["Single low chime and steady amber light on all MCLs.","Three high chimes and flashing green light on all MCLs.","Hi-Lo chime and steady blue light on all MCLs."]],
["x","Where are the Direct Access PA buttons located on the B777-300?","L1, R2 and L5.",["L1, R1 and L5.","L2, R2 and R5.","L1 and L4 only."]],
["x","Where is the Water System 'OFF' button located on the B777-200 LR?","L4 CSP",["L1 CSP","R2 CSP","L5 CSP"]]
]},
{id:"sta380",n:"A380",ic:"🛬",cat:"st",q:[
["x","True or False? The Flight Deck escape panel can only be opened from the Flight Deck side.","True",["False"]],
["x","Which emergency exits will ML1 Cabin Crew demonstrate during an emergency/manual demonstration?","M1 & M2 doors.",["M1 & M3 doors.","U1 & U2 doors.","M1 door only."]],
["x","State the responsibilities of the 'A' position Cabin Crew during an emergency situation.","Act as directed by the Purser and/or Cabin Supervisor.",["Take command of the cabin until the Captain arrives.","Operate the nearest door without waiting for commands.","Stay at the Flight Deck door until landing."]],
["x","When would Cabin Crew have to operate a door manually (A380)?","If the DSIP buttons are inoperative or electrical power is not available.",["Whenever the slide is armed.","Only during a ditching.","Whenever the aircraft is on an air bridge."]],
["x","Which doors are equipped with a belly fairing integrated escape slide?","The Main Deck doors M3.",["The Main Deck doors M1.","The Upper Deck doors U3.","The Main Deck doors M5."]],
["x","What will Cabin Crew do if the EPAS fails to operate during Emergency Operation (A380)?","Push the door open and ask ABPs for assistance if necessary.",["Block the exit and redirect passengers.","Re-arm the door and try again.","Wait for the Flight Crew to reset the EPAS."]],
["x","When must the Upper Deck slide raft survival kit be removed and prepared during a planned emergency?","During emergency cabin preparation.",["After the aircraft comes to a complete stop.","Only after the Captain orders the evacuation.","During the pre-flight check."]],
["x","When will the SLIDE NOT READY indicator flash RED?","On ground with electrical power, when pressing the MIP fails to inflate the slide or the M1 slide extensions are not activated in a nose-up attitude.",["When the door is disarmed before arrival.","35 minutes after landing, when the slide inflation bottle pressure is low.","Whenever the cabin is still pressurised."],"When the aircraft is on ground with electrical power available when: pressing the MIP fails to inflate the escape slide/slide raft, OR the M1 slide extensions are not activated automatically in aircraft nose up (tail tip) attitude."],
["x","Where is the gust lock located for M2/M3/M4/M5?","Above the support arm.",["Below the support arm.","On the aft side of the door frame.","Next to the door control handle."]],
["x","Where is the gust lock located for M1/U1/U2/U3?","Below the support arm.",["Above the support arm.","On the forward side of the door frame.","Next to the door control handle."]],
["x","When will the SLIDE NOT READY indicator illuminate steady red?","35 minutes after landing (with electrical power), when the slide inflation bottle pressure is low.",["When the door is armed and closed.","When pressing the MIP fails to inflate the slide.","When the gust lock is not engaged."]],
["x","What actions should the Cabin Crew take when the Cabin Pressure Light flashes red at their door?","Do not open the door; report to the Purser, who informs the Flight Crew once stopped with engines off.",["Open the door slowly using the assist handle.","Disarm the door and open it immediately.","Re-arm the door and wait 5 minutes."],"Cabin Crew shall not open the door, immediately report to the Purser who shall inform the Flight Crew once the aircraft has come to a complete stop and engines are off."],
["x","What will happen if the slide arming lever is in the armed position and the door is opened from outside?","It will automatically move to the disarmed position.",["The slide will inflate automatically.","The door will not open from outside.","An alarm sounds and the slide deploys."]],
["x","What are the secondary exits in case of ditching on the A380?","None.",["The Upper Deck doors.","The Main Deck doors M3.","The Flight Deck windows."]],
["x","State the auxiliary exits in case of a land evacuation (A380).","Flight Deck sliding windows.",["Main Deck doors M3.","Upper Deck doors U3.","The crew rest emergency hatch."]],
["x","Where is the Emergency Escape Path Lighting installed (A380)?","On the outboard aisle seats.",["Along the centre of the aisle floor.","On the overhead bins.","On the cabin ceiling panels."]],
["x","What is the duration of the emergency light (A380)?","Approximately 10 mins.",["Approximately 15 mins.","Approximately 30 mins.","Approximately 4 hours."]],
["x","Where can the emergency evacuation signalling system be activated (A380)?","The Flight Deck overhead control panel.",["Any Flight Attendant Panel.","The Purser's station only.","Any cabin interphone handset."]],
["x","When will the cabin automatic drop-down oxygen system be deactivated (A380)?","When the cabin altitude reaches 10,000 feet, the oxygen flow will stop.",["When the cabin altitude reaches 14,000 feet.","After exactly 15 minutes of flow.","Only when the Purser resets it from the FAP."]],
["x","How will the cabin automatic drop-down oxygen system deploy (A380)?","Automatically at 14,000 ft (±500 ft), electrically via the MASK MAN ON switch, or manually with the Manual Release Tool (MRT).",["Automatically at 10,000 ft, or manually by pulling the yellow lanyard.","Only electrically from the Flight Deck overhead panel.","Automatically at 25,000 ft, or from the Purser's FAP."],"Automatically at 14,000 ft cabin altitude (±500 ft): all service units open releasing oxygen masks. Electrically from the Flight Deck overhead panel by pressing the MASK MAN ON switch. Manually using a Manual Release Tool (MRT)."],
["x","When shall the cabin crew conduct the safety and emergency pre-flight check?","Upon hearing the Purser's PA.",["As soon as they board the aircraft.","After the passengers have boarded.","After the doors are armed."]],
["x","How often should the lavatories/SPA and galleys be checked for fire/smoke hazard?","Recommended at least every 30 minutes.",["At least every hour.","At least every 15 minutes.","Only after each meal service."]],
["x","How will the Flight Crew inform Cabin Crew of the completion of fuelling operation?","By switching on the seatbelt sign.",["With a Hi-Lo chime.","With a PA to all cabin crew.","By flashing the cabin lights."]],
["x","What are the two types of Flight Crew Incapacitation?","Partial and complete incapacitation.",["Short and long incapacitation.","Medical and physical incapacitation.","Temporary and permanent incapacitation."]],
["x","What is the pre-flight check of the Fire Protective Gloves?","Correct quantity and securely stowed.",["Worn once to test the fit.","Expiry date and pressure gauge in the green.","Seal intact and inflation tested."]],
["x","What is the indication that confirms that the PBE is working?","A loud hissing sound will be heard while the hood inflates.",["A green light on the PBE canister.","The hood changes colour to orange.","A beeping sound from the oxygen generator."]],
["x","True or False? Do not open the containment bag (Fire Sock) after a device that has sustained major damage or was involved in fire/smoke has been placed in it.","True",["False"]],
["x","State the pre-flight check of the Infant/Extension Seat Belt.","Correct minimum quantity.",["Correct maximum quantity and buckle tested.","One per door, attached to the jump seat.","Checked by the ground staff only."]],
["x","When should a life jacket be inflated in a ditching situation?","When exiting the aircraft.",["Before the impact.","As soon as it is put on.","Only after being in the water for a while."]],
["x","State the duration of the ADT406S.","Approximately 60 hours.",["Approximately 24 hours.","Approximately 48 hours.","Approximately 10 hours."]]
]},
{id:"sta350",n:"A350",ic:"✈️",cat:"st",q:[
["x","State both the normal and emergency access code to the Flight Deck (A350).","Normal: 1 then # · Emergency: 345 and #",["Normal: 345 and # · Emergency: 1 then #","Normal: 1 then * · Emergency: 345 and *","Normal: 12 then # · Emergency: 999 and #"]],
["x","How many oxygen bottles are located at the R2 station?","2",["1","3","4"]],
["x","State the pre-flight check of the ELiTe.","Correct quantity and securely stowed.",["Battery light green and antenna attached.","Switched ON and tested.","Checked by the ground staff only."]],
["x","Where is the ELT Elite located?","L1 & L4",["L1 & R4","R1 & L3","L2 & R4"]],
["x","What doors will R3 demonstrate in an emergency demonstration?","LR3 & LR4",["LR2 & LR3","R3 only","LR1 & LR2"]],
["x","When shall Cabin Crew arm the cabin doors (A350)?","Upon hearing the PA: \"Cabin Crew prepare all doors and cross-check\".",["As soon as the last passenger boards.","When the seatbelt sign is switched on.","When the air bridge starts to move."]],
["x","True or False? Cabin Crew are permitted to remove the Air Bridge Safety Shoe.","False",["True"]],
["x","What are the Primary Exits for a Ditching (A350)?","All cabin doors.",["Doors 1 and 2 only.","Doors 3 and 4 only.","The Flight Deck windows."]],
["x","Where can the emergency evacuation signalling system be reset from (A350)?","Only from the Flight Deck command switch.",["From any Flight Attendant Panel.","From the Purser's station or the Flight Deck.","From any door handset."]],
["x","Where can the emergency lights be activated from manually (A350)?","From the Flight Deck and the Flight Attendant Panels.",["From the Flight Deck only.","From the Flight Attendant Panels only.","From any door handset."]],
["x","When do the Slide Raft Integral Emergency Lights illuminate?","Upon slide raft deployment.",["When the emergency lights are switched on.","When the door is armed.","Only when they touch the water."]],
["x","How can the oxygen be activated in areas with high ceilings (A350)?","Pull the red PULL lanyard: the masks drop further and the oxygen flows.",["Use the Manual Release Tool.","Pull the yellow lanyard on the mask.","Press the oxygen key on the FAP."],"A red PULL lanyard is installed in areas with higher ceilings. Pulling the lanyard allows the masks to drop further and active the oxygen flow."],
["x","State the indication that the lavatory oxygen cylinder is empty.","A red string is visible from the opened door stopper.",["A red light on the lavatory call panel.","The pressure gauge shows zero.","A yellow flag appears on the PSU."]],
["x","How can you reset the Smoke Detector (A350)?","Press the Smoke Reset hard key/soft key on any of the FAPs or AAPs.",["Press the flashing amber lavatory call light.","Press the test button on the detector.","Ask the Flight Crew to reset it from the overhead panel."]],
["x","What is the audio indication inside the FCRC if there is smoke detected in Lavatory A?","A single low chime sounds repeatedly for 30 seconds.",["A Hi-Lo chime sounds once.","Three high chimes every minute.","A continuous horn until reset."]],
["x","How is an emergency PA made on the A350 aircraft?","Press and hold the PTT key.",["Press 4* and hold the PTT key.","Press the EMER key for 2 seconds.","Press 46 and release the PTT key."]],
["x","How can Cabin Crew initiate an emergency interphone call from the cabin (A350)?","Press and hold the EMER key on the handset for 2 seconds.",["Press 4* and hold the PTT key.","Press the EMER key twice quickly.","Press 5 and # on the handset."]],
["x","State the location of the PRM Lavatory Water Shut-off Valves on the A350.","One under the sink (tap water) and one at the base of the toilet seat at floor level (toilet flush).",["Both under the sink.","One behind the mirror and one under the sink.","In the galley, next to the water system panel."]],
["x","What is the access code to enter the CRC (A350)?","Press ABCDE and # key.",["Press 12345 and # key.","Press ABCDE and * key.","Press 1 then #."]],

function build(e){
  const f=e.f;const[g,t,a,ex]=f;let q=t,ans,ds;
  if(g==="x"){ans=a;ds=ex}
  else{
    const u=U[g];ans=a+u;
    if(["kg","lb","L","gal"].includes(g))q+=" (em "+u.trim()+")";
    let p=P[g].filter(x=>x!==a);
    if(u!==""&&p.every(x=>isFinite(num(x))))p=p.sort((x,y)=>Math.abs(num(x)-num(a))-Math.abs(num(y)-num(a))).slice(0,6);
    ds=sh(p).slice(0,3).map(x=>x+u);
  }
  return{q,ans,g,idx:e.k,ex:f[4]||"",opts:sh([ans,...ds])};
}

/* ---------- cronômetro da meta diária ---------- */
const idleMs=()=>(TM.i||3)*60000; // tempo parado até pausar
let inRound=false; // só conta durante um questionário
const dk=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
let lastAct=Date.now(),blurred=false,running=false,unsaved=0,goalMsg=false;
["pointerdown","keydown","touchstart","wheel","scroll"].forEach(ev=>addEventListener(ev,()=>{lastAct=Date.now();blurred=false},{passive:true,capture:true}));
addEventListener("blur",()=>{blurred=true;tick(true);saveTime()});
addEventListener("focus",()=>{blurred=false;lastAct=Date.now();tick(true)});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState!=="visible"){tick(true);saveTime()}else{lastAct=Date.now();blurred=false;tick(true)}});
addEventListener("pagehide",()=>saveTime());
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?h+":"+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0"):m+":"+String(x).padStart(2,"0")};
const todayS=()=>TM.d[dk()]||0;
function streak(){
  let n=0;const d=new Date();
  if(todayS()>=TM.g)n=1;
  d.setDate(d.getDate()-1);
  while((TM.d[dk(d)]||0)>=TM.g){n++;d.setDate(d.getDate()-1)}
  return n;
}
function tick(uiOnly){
  const on=inRound&&view==="quiz"&&document.visibilityState==="visible"&&!blurred&&Date.now()-lastAct<idleMs();
  if(!uiOnly&&on){
    const k=dk(),before=TM.d[k]||0;TM.d[k]=before+1;unsaved++;
    if(before<TM.g&&TM.d[k]>=TM.g&&!goalMsg){goalMsg=true;toast("🎉 Meta de hoje batida! "+Math.round(TM.g/60)+" min de estudo.");saveTime();if(view==="home")drawHome()}
    if(unsaved>=20){unsaved=0;saveTime()}
  }
  running=on;
  const s=todayS(),p=Math.min(s/TM.g,1),done=s>=TM.g;
  $("tchip").className="chip"+(on?" run":"");
  $("ctxt").textContent=fmt(s)+" / "+Math.round(TM.g/60)+" min";
  const cr=$("cring");cr.querySelector(".rf").style.strokeDashoffset=94.25*(1-p);cr.classList.toggle("done",done);
  const gr=$("gring");if(gr){gr.querySelector(".rf").style.strokeDashoffset=301.6*(1-p);gr.classList.toggle("done",done);$("gtime").textContent=fmt(s);$("gstat").textContent=on?"▶ Contando":"⏸ Pausado: conta só durante um questionário"}
}
setInterval(()=>tick(false),1000);
$("tchip").onclick=()=>go("home");

  const st=el("div","stp"),mi=el("button",null,"−"),vv=el("span"),pl=el("button",null,"+");

  st.append(mi,vv,pl);c.appendChild(st);
  const ch=el("div","seg");[15,30,45,60,90].forEach(v=>{const b=el("button",null,v+" min");b.dataset.v=v;b.onclick=()=>{g=v;upd()};ch.appendChild(b)});c.appendChild(ch);
  mi.onclick=()=>{g=Math.max(5,g-5);upd()};pl.onclick=()=>{g=Math.min(240,g+5);upd()};
  c.appendChild(el("div","lbl","Pausar o cronômetro depois de ficar parado por"));
  const ch2=el("div","seg");[1,2,3,5].forEach(v=>{const b=el("button",null,v+" min");b.dataset.v=v;b.onclick=()=>{it=v;upd()};ch2.appendChild(b)});c.appendChild(ch2);
  c.appendChild(el("p","note","O tempo só conta enquanto você responde um questionário, com o app aberto na tela. Fora disso (tela inicial, histórico, configurações) ele fica pausado."));
  c.appendChild(el("div","lbl","Cronômetro de hoje"));
  const rs=el("button","go sec");rs.style.marginTop="0";let armed=false;
  const rl=()=>rs.textContent="⏱️ Zerar o tempo de hoje ("+fmt(todayS())+")";rl();
  rs.onclick=()=>{
    if(!armed){armed=true;rs.textContent="Toque de novo para confirmar";rs.classList.add("dang");setTimeout(()=>{if(armed){armed=false;rs.classList.remove("dang");rl()}},4000);return}
    armed=false;rs.classList.remove("dang");TM.d[dk()]=0;goalMsg=false;saveTime();tick(true);rl();toast("⏱️ Tempo de hoje zerado");
  };
  c.appendChild(rs);
  c.appendChild(el("p","note","Vale só para hoje e para o perfil "+prof().e+" "+prof().n+". Os outros dias não mudam."));
  c.appendChild(el("p","note","Versão do app: "+APPV));
  const sv=el("button","go","Salvar");sv.style.marginTop="16px";
  sv.onclick=()=>{TM.g=g*60;TM.i=it;goalMsg=todayS()>=TM.g;saveTime();toast("✓ Meta: "+g+" min por dia");go("home")};c.appendChild(sv);
  function upd(){vv.textContent=g+" min";ch.querySelectorAll("button").forEach(b=>b.className=+b.dataset.v===g?"on":"");ch2.querySelectorAll("button").forEach(b=>b.className=+b.dataset.v===it?"on":"")}
  upd();
}

/* ---------- histórico ---------- */
let HT="all";
function drawHist(){
  const h=$("hs");h.innerHTML="";
  // tempo de estudo
  const c0=el("div","card");h.appendChild(c0);
  c0.appendChild(el("p","q","⏱️ Tempo de estudo por dia"));
  const days=[];for(let k=13;k>=0;k--){const d=new Date();d.setDate(d.getDate()-k);days.push(d)}
  const vals=days.map(d=>(TM.d[dk(d)]||0)/60),gm=TM.g/60;
  const wk=vals.slice(-7),avg=Math.round(wk.reduce((a,b)=>a+b,0)/7),met=Object.values(TM.d).filter(v=>v>=TM.g).length;
  c0.appendChild(el("p","msg","Hoje "+Math.floor(todayS()/60)+" min · média 7 dias "+avg+" min · 🔥 "+streak()+" seguidos · meta batida em "+met+(met===1?" dia":" dias")));
  {const W=600,Hh=200,x0=36,y0=14,w=W-x0-10,hh=Hh-y0-28,mx=Math.max(gm*1.25,...vals,1),bw=w/14*0.62;
   const Y=v=>y0+hh-v/mx*hh,X=k=>x0+w/14*(k+.5);let g="";
   [0,.5,1].map(f=>Math.round(mx*f)).forEach(v=>{g+=`<line x1="${x0}" x2="${W-10}" y1="${Y(v)}" y2="${Y(v)}" class="gl"/><text x="${x0-6}" y="${Y(v)+4}" text-anchor="end" class="gt">${v}</text>`});
   vals.forEach((v,k)=>{const d=days[k];g+=`<rect x="${X(k)-bw/2}" y="${Y(v)}" width="${bw}" height="${Math.max(0,y0+hh-Y(v))}" rx="3" class="bx${v>=gm?" ok":""}"><title>${d.toLocaleDateString("pt-BR")}: ${Math.round(v)} min</title></rect><text x="${X(k)}" y="${Hh-8}" text-anchor="middle" class="gt">${d.getDate()}</text>`});
   g+=`<line x1="${x0}" x2="${W-10}" y1="${Y(gm)}" y2="${Y(gm)}" class="gx"/><text x="${W-12}" y="${Y(gm)-5}" text-anchor="end" class="gt">meta ${gm} min</text>`;
   const wr=el("div","sc");wr.innerHTML=`<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Minutos de estudo nos últimos 14 dias">${g}</svg>`;c0.appendChild(wr)}
  // acertos
  const c=el("div","card");h.appendChild(c);
  c.appendChild(el("p","q","🎯 Acertos de primeira por prova"));
  const sel=el("select","in");[["all","Todos os temas"],...TEMAS.map(t=>[t.id,t.n])].forEach(([v,n])=>{const o=el("option",null,n);o.value=v;sel.appendChild(o)});sel.value=HT;sel.onchange=()=>{HT=sel.value;drawHist()};c.appendChild(sel);
  const R=H.runs.filter(isProva).filter(r=>HT==="all"||(r.tp||"c152")===HT).sort((a,b)=>a.t-b.t);
  if(!R.length){c.appendChild(el("p","note","Ainda não há rodadas concluídas aqui. Termine um quiz para ver o gráfico."));}
  else{
  const pc=R.map(r=>Math.round(r.f/r.n*100));
  const av=Math.round(pc.reduce((a,b)=>a+b,0)/pc.length),best=Math.max(...pc);
  c.appendChild(el("p","note","Só provas: rodadas de refazer erradas e de revisão de erros não entram."));
  c.appendChild(el("p","msg",R.length+(R.length===1?" prova":" provas")+" · média "+av+"% · melhor "+best+"% · última "+pc[pc.length-1]+"%"));
  const L=R.slice(-30),p=pc.slice(-30),W=600,Hh=220,x0=36,y0=16,w=W-x0-12,hh=Hh-y0-28;
  const X=k=>x0+(L.length>1?k/(L.length-1)*w:w/2),Y=v=>y0+hh-v/100*hh;
  let g="";
  [0,25,50,75,100].forEach(v=>{g+=`<line x1="${x0}" x2="${W-12}" y1="${Y(v)}" y2="${Y(v)}" class="gl"/><text x="${x0-6}" y="${Y(v)+4}" text-anchor="end" class="gt">${v}%</text>`});
  g+=`<polyline points="${p.map((v,k)=>X(k)+","+Y(v)).join(" ")}" class="ln"/>`;
  p.forEach((v,k)=>{const n=R.length-L.length+k+1,d=new Date(L[k].t).toLocaleDateString("pt-BR"),tn=tName(L[k].tp||"c152");g+=`<circle cx="${X(k)}" cy="${Y(v)}" r="4" class="dt"><title>Rodada ${n} · ${tn} (${L[k].b||"Todas"}): ${v}% (${L[k].f}/${L[k].n}) em ${d}</title></circle>`;if(L.length<=15||k%5===0)g+=`<text x="${X(k)}" y="${Hh-8}" text-anchor="middle" class="gt">${n}</text>`});
  const wrap=el("div","sc");wrap.innerHTML=`<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Gráfico de acertos de primeira por rodada">${g}</svg>`;c.appendChild(wrap);
  }
  const wk2=Object.entries(H.weak).filter(([k])=>KM[k]&&(HT==="all"||KM[k].tp===HT)).sort((a,b)=>b[1]-a[1]).slice(0,10);
  if(wk2.length){
    const t2=el("p","q","Questões que mais erro");t2.style.marginTop="20px";c.appendChild(t2);
    const ol=el("ol");
    wk2.forEach(([k,v])=>{const f=KM[k].f;ol.appendChild(el("li",null,f[1]+" — "+(f[0]==="x"?f[2]:f[2]+U[f[0]])+" ("+v+"×)"))});
    c.appendChild(ol);
  }
  c.appendChild(el("p","note",db?"Histórico e tempo salvos na sua conta do Claude.":"Histórico e tempo salvos neste aparelho. Faça um backup de vez em quando."));
  drawBackup(h);
}
/* ---------- backup ---------- */
const backupData=()=>JSON.stringify({app:"estudos-pc",v:1,at:Date.now(),H,TM});
async function importData(txt){
  const o=JSON.parse(txt);if(!o||o.app!=="estudos-pc"||!o.H)throw new Error("arquivo inválido");
  const have=new Set(H.runs.map(r=>r.t)),nw=(o.H.runs||[]).filter(r=>r&&r.t&&!have.has(r.t));
  H.runs.push(...nw);
  Object.entries(o.H.weak||{}).forEach(([k,v])=>H.weak[k]=Math.max(H.weak[k]||0,v));
  Object.entries(o.H.seen||{}).forEach(([k,v])=>H.seen[k]=Math.max(H.seen[k]||0,v));
  Object.entries((o.TM||{}).d||{}).forEach(([k,v])=>TM.d[k]=Math.max(TM.d[k]||0,v));
  if(db){try{const c=db.collection("data/users/"+uid);for(const r of nw)await c.doc(D("r"+r.t)).set(r);await c.doc(D("weak")).set({c:H.weak,s:H.seen})}catch(e){}}
  lsSave();await saveTime();
  return nw.length;
}
function drawBackup(h){
  const c=el("div","card");h.appendChild(c);
  c.appendChild(el("p","q","💾 Backup"));
  c.appendChild(el("p","help","Guarde uma cópia do histórico e do tempo de estudo, ou passe os dados de um aparelho para outro. Importar junta os dados, não apaga nada."));
  const m=el("div","msg");
  const r1=el("div","row");c.appendChild(r1);
  const ex=el("button","go","Exportar arquivo");ex.onclick=()=>{try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([backupData()],{type:"application/json"}));a.download="estudos-pc-backup-"+dk()+".json";document.body.appendChild(a);a.click();a.remove();m.className="msg ok";m.textContent="Arquivo gerado. Se nada aparecer, use Copiar backup."}catch(e){m.className="msg er";m.textContent="Não deu para baixar aqui. Use Copiar backup."}};r1.appendChild(ex);
  const cp=el("button","go sec","Copiar backup");cp.onclick=async()=>{try{await navigator.clipboard.writeText(backupData());m.className="msg ok";m.textContent="Backup copiado. Cole em Notas ou no outro aparelho."}catch(e){m.className="msg er";m.textContent="Não deu para copiar neste aparelho."}};r1.appendChild(cp);
  const r2=el("div","row");c.appendChild(r2);
  const fi=el("input");fi.type="file";fi.accept=".json,application/json,text/plain";fi.hidden=true;c.appendChild(fi);
  const im=el("button","go sec","Importar arquivo");im.onclick=()=>fi.click();r2.appendChild(im);
  const pa=el("button","go sec","Colar backup");r2.appendChild(pa);
  const ta=el("textarea","in");ta.placeholder="Cole aqui o texto do backup";ta.hidden=true;ta.style.marginTop="10px";c.appendChild(ta);
  const ok=el("button","go","Importar o texto colado");ok.hidden=true;c.appendChild(ok);
  c.appendChild(m);
  const run=async txt=>{try{const n=await importData(txt);m.className="msg ok";m.textContent="✓ Backup importado: "+n+(n===1?" rodada nova.":" rodadas novas.");setTimeout(()=>{drawHist()},1200)}catch(e){m.className="msg er";m.textContent="✗ Esse backup não é válido."}};
  fi.onchange=async()=>{const f=fi.files[0];if(f)run(await f.text())};
  pa.onclick=()=>{ta.hidden=!ta.hidden;ok.hidden=ta.hidden;if(!ta.hidden)ta.focus()};
  ok.onclick=()=>{if(ta.value.trim())run(ta.value.trim())};
}

go("home");
init();
if("serviceWorker" in navigator&&window.isSecureContext&&typeof claude==="undefined"){
  let hadCtl=!!navigator.serviceWorker.controller,reloaded=false;
  navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(reg=>{
    document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")reg.update().catch(()=>{})});
  }).catch(()=>{});
  navigator.serviceWorker.addEventListener("controllerchange",()=>{
    if(!hadCtl||reloaded)return;reloaded=true;
    if(!inRound)location.reload();else toast("Nova versão baixada. Ela abre quando você terminar a rodada.");
  });
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
}
